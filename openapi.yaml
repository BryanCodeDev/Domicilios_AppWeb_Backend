openapi: 3.0.0
info:
  title: DomiRapid API
  description: API for food delivery platform
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://localhost:5000/api/v1
    description: Development server

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password, rol]
              properties:
                nombre:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                rol:
                  type: string
                  enum: [cliente, repartidor, negocio]
      responses:
        '201':
          description: User created successfully

  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful

  /auth/me:
    get:
      summary: Get user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile

  /businesses:
    get:
      summary: Get all businesses
      tags: [Businesses]
      responses:
        '200':
          description: List of businesses

  /products:
    get:
      summary: Get products
      tags: [Products]
      responses:
        '200':
          description: List of products

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

